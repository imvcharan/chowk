services:
  - type: web
    name: chowk-backend
    env: node
    region: ohio
    plan: starter
    branch: main
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: chowk-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 24h
      - key: REFRESH_TOKEN_EXPIRATION
        value: 7d

databases:
  - name: chowk-db
    databaseName: chowk_production
    user: chowk_user
    region: ohio
    plan: free
